
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seleção de Portfólio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #e0f2fe 0%,
        #f1f5f9 45%,
        #dbeafe 100%
    );
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
        }

        

.container {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 90%;
    max-width: 600px;
}


        .container {
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            color: #172554;
            font-size: 32px;
            margin-bottom: 12px;
        }

        h2 {
            color: #475569;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 35px;
        }

        .opcoes {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .botao {
            background-color: white;
            color: #1d4ed8;
            text-decoration: none;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 30px 20px;
            width: 50%;
            font-size: 22px;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao:hover {
            background-color: #1d4ed8;
            color: white;
            border-color: #1d4ed8;
        }

        /* Cores exclusivas do SESI */
        .botao-sesi {
            color: #dc2626;
        }

        .botao-sesi:hover {
            background-color: #dc2626;
            color: white;
            border-color: #dc2626;
        }

        .descricao {
            display: block;
            font-size: 13px;
            font-weight: normal;
            margin-top: 10px;
        }

        /* Espaço para o link de voltar ao login */
        
.voltar-login {
    display: inline-block;
    margin-top: 55px;
    padding: 10px 18px;
    background-color: white;
    color: #172554;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    transition: 0.3s;
}

.voltar-login:hover {
    background-color: #e2e8f0;
    color: #172554;
    border-color: #94a3b8;
}


        @media (max-width: 480px) {
            .opcoes {
                flex-direction: column;
            }

            .botao {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>SEJA BEM-VINDO!</h1>

        <h2>Escolha seu Portfólio</h2>

        <div class="opcoes">

            <a href="sesi.html" class="botao botao-sesi">
                SESI
                <span class="descricao">Acessar portfólio</span>
            </a>

            <a href="senai.html" class="botao">
                SENAI
                <span class="descricao">Acessar portfólio</span>
            </a>

        </div>

        
       <a href="login.html" class="voltar-login">
         VOLTAR AO LOGIN
       </a>


    </main>

</body>
</html>
